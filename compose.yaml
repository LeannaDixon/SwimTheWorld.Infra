name: SwimTheWorld

services:
    kafka:
        image: confluentinc/cp-kafka:8.1.0
        container_name: kafka
        # map host port 9092 to container port 9092
        ports:
            - "9092:9092"

        environment:
        # Single node KRaft mode configuration
            KAFKA_KRAFT_MODE: 'true'

            # Id all nodes will get to label themselves in the cluster
            CLUSTER_ID: 'some-123-cluster-456-id'
            KAFKA_NODE_ID: 1

            KAFKA_PROCESS_ROLES: broker, controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            # 1 Copy of meta data - Keeps track of metadata changes: which consumers have read which messages. Default is 3
            KAFKA_OFFSET_TOPIC_REPLICATION_FACTOR: 1

            # Tells Kafka to open 2 doors:
            # 1 = For producers and consumers (clients) to connect to Kafka
            # 2 = For controller communication = node-to-node communication
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            # Address Kafka tells clients and brokers to connect to
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            # Address Kafka tells controllers how to connect. Using the controller door defined above via alias
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

            # Tells Kafka where to store data
            KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        
        # Kafka will store the metaData inside the container and binding it to the volume called kafka_kraft
        volumes:
            - kafka_kraft:/var/lib/kafka/data

# Allow logs and metadata from containers persist outside the container
volumes:
    kafka_kraft:
            

